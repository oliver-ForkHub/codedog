name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-android-apk.yml"

permissions:
  contents: write

concurrency:
  group: mobile-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL || 'https://54188.xyz/api' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Validate Expo project
        run: npm run check

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build installable release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp android/app/build/outputs/apk/release/app-release.apk artifact/codedog-mobile.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: codedog-mobile-apk-${{ github.run_number }}
          path: mobile/artifact/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK download
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view mobile-latest >/dev/null 2>&1; then
            gh release upload mobile-latest mobile/artifact/codedog-mobile.apk --clobber
          else
            gh release create mobile-latest mobile/artifact/codedog-mobile.apk --title "编程狗社区 Android 最新版" --notes "由 main 分支自动构建。此下载始终指向最新 APK。"
          fi
